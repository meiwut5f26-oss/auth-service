spring:
  datasource:
    url: jdbc:h2:mem:csfc-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      url: redis://localhost:6379
      ssl:
        enabled: false
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    org.hibernate.SQL: DEBUG

jwt:
  secret: c2VjdXJlX3Rlc3Rfc2VjcmV0X2tleV9mb3JfdGVzdF9sb25nX3N0cmluZw==
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

application:
  config:
    franchise-service-url: api-gate-way.onrender.com
    order-service-url: api-gate-way.onrender.com

mail:
  from: test@csfc.local
  from-name: CSFC Test Sender

resend:
  api-key: test-api-key
  from-email: test@csfc.local
  base-url: https://api.resend.com

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: false

springdoc:
  api-docs:
    enabled: false
