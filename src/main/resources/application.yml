server:
  port: ${SERVER_PORT}
  forward-headers-strategy: framework

application:
  config:
    order-service-url: ${SERVICE_URL}
    franchise-service-url: ${SERVICE_URL}
logging:
  level:
    org.springframework.boot.context.config: DEBUG
spring:
  application:
    name: csfc-auth-service
  config:
    import: optional:file:.env[.properties]


  datasource:
    url: jdbc:postgresql://localhost:5444/auth_db
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 30000
      connection-timeout: 60000
      validation-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      connection-test-query: SELECT 1

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

app:
  admin-init:
    enabled: ${ADMIN_INIT_ENABLED:false}
    email: ${ADMIN_INIT_EMAIL:}
    password: ${ADMIN_INIT_PASSWORD:}
    name: ${ADMIN_INIT_NAME:System Admin}
    role-name: ${ADMIN_INIT_ROLE:ADMIN}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_ENABLED:false}
    fetch-registry: ${EUREKA_CLIENT_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: false
    discovery:
      enabled: false
    mail:
      enabled: false