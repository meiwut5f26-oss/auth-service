<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Success</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f9fb; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 80px auto; background: #fff; padding: 32px 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin: 0 0 12px; color: #0f172a; }
        p { margin: 0 0 20px; color: #334155; }
        .btn { display: inline-block; padding: 12px 18px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="container">
    <h2>Password reset successful!</h2>
    <p>You can now log in with your new password.</p>
</div>
</body>
</html>
