<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f9fb; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 80px auto; background: #fff; padding: 32px 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h2 { margin: 0 0 16px; color: #0f172a; text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: 600; color: #0f172a; }
        input[type="password"] { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; }
        input[type="password"]:focus { outline: 2px solid #2563eb; border-color: transparent; }
        button { padding: 12px 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .alert { padding: 12px; border-radius: 8px; font-size: 14px; }
        .alert.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Password</h2>
    <div th:if="${error}" class="alert error">
        <p th:text="${error}"></p>
    </div>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}" />
        <label>New Password</label>
        <input type="password" name="newPassword" required />
        <button type="submit">Reset</button>
    </form>
</div>
</body>
</html>
