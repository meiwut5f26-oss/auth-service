version: '3.8'

services:
  csfc-auth-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5444:5432"
    volumes:
      - csfc_postgres_data:/var/lib/postgresql/data

volumes:
  csfc_postgres_data: